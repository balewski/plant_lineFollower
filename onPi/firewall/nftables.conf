#!/usr/sbin/nft -f
# Pi outbound is limited to this LAN, the router DNS, the Raspberry Pi OS
# archives on port 80, and GitHub on ports 22 and 443.
# Inbound accepts SSH and mDNS only from 10.0.0.0/24.

flush ruleset

table inet robot {
    set apt_v4 {
        type ipv4_addr
        flags interval
        elements = {
                93.93.128.193, 176.126.240.167, 176.126.240.84, 176.126.240.86, 176.126.243.3,
                176.126.243.5, 176.126.243.6, 46.235.231.111, 46.235.231.145, 46.235.231.151,
                93.93.135.117, 93.93.135.118, 93.93.135.141
        }
    }

    set git_v4 {
        type ipv4_addr
        flags interval
        auto-merge
        elements = {
                192.30.252.0/22, 185.199.108.0/22, 140.82.112.0/20, 143.55.64.0/20,
                20.201.28.151/32, 20.205.243.166/32, 20.205.243.161/32, 20.87.245.0/32,
                20.87.245.2/32, 4.237.22.38/32, 4.237.22.36/32, 4.228.31.150/32,
                4.228.31.144/32, 20.207.73.82/32, 20.207.73.81/32, 20.27.177.113/32,
                20.27.177.119/32, 20.200.245.247/32, 20.200.245.244/32, 20.175.192.147/32,
                20.233.83.145/32, 20.233.83.148/32, 20.29.134.23/32, 20.29.134.22/32,
                20.199.39.232/32, 20.217.135.5/32, 20.217.135.1/32, 4.225.11.194/32,
                4.225.11.199/32, 4.208.26.197/32, 4.208.26.193/32, 20.26.156.215/32,
                20.26.156.213/32, 172.182.252.133/32, 172.182.252.130/32, 4.249.131.164/32,
                48.202.248.40/32, 48.204.201.5/32, 20.201.28.152/32, 20.205.243.160/32,
                20.87.245.4/32, 4.237.22.40/32, 4.228.31.145/32, 20.207.73.83/32,
                20.27.177.118/32, 20.200.245.248/32, 20.175.192.146/32, 20.233.83.149/32,
                20.29.134.19/32, 20.199.39.227/32, 20.217.135.4/32, 4.225.11.200/32,
                4.208.26.198/32, 20.26.156.214/32, 172.182.252.135/32, 4.249.131.163/32,
                48.202.248.38/32, 48.204.201.6/32
        }
    }

    chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        iif "lo" accept
        ip saddr 10.0.0.0/24 tcp dport 22 accept
        ip saddr 10.0.0.0/24 icmp type echo-request accept
        ip saddr 10.0.0.0/24 udp dport 5353 accept
        udp sport 67 udp dport 68 accept
        icmpv6 type { nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
    }

    chain output {
        type filter hook output priority filter; policy drop;
        ct state established,related accept
        oif "lo" accept
        ip daddr 10.0.0.0/24 accept
        udp dport 53 ip daddr 10.0.0.1 accept
        tcp dport 53 ip daddr 10.0.0.1 accept
        tcp dport 80 ip daddr @apt_v4 accept
        tcp dport { 22, 443 } ip daddr @git_v4 accept
        udp dport 67 ip daddr 255.255.255.255 accept
        udp dport 5353 ip daddr 224.0.0.251 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }
}
